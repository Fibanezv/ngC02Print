<div class="block">
    <!-- Logo -->

    <div class="items-center justify-center h-40">
      <div *ngIf="huellaCalculadaTitle === 0">
        <h1 class="text-5xl font-bold tracking-tight text-white mb-5">CO₂ Print</h1>
      </div>
      <div *ngIf="huellaCalculadaTitle > 0">
        <h1 class="text-2xl font-bold tracking-tight text-white sm:text-2xl mb-5">Has generado: </h1>
        <h2 class="text-5xl font-bold tracking-tight text-white sm:text-5xl">{{huellaCalculadaTitle}} Kg de CO₂.</h2>
      </div>
      <hr class="w-2/6 mt-5">
    </div>  


    <div class="flex w-full gap-32">
      <label for="countries" class="block mb-2 text-lg font-medium text-white w-2/5 pl-10">Transporte</label>
      <label for="kms" class="block mb-2 text-lg font-medium text-white w-1/5 pl-9">Kilómetros</label>
    </div>

    <div class="flex justify-center gap-24">
      <div class="flex w-56">
        <select class="w-18 font-bold border border-gray-300 text-gray-600 text-base rounded-lg block w-full py-2.5 px-4 focus:outline-none" (change)="onTransporteChange($event)">
          <option value="coche">🚗 - Coche</option>
          <option value="avion">✈️ - Avión</option>
          <option value="moto">🏍️ - Moto</option>
          <option value="publico">🚌 - Transp. Público</option>
        </select>
      </div>
      <div class="flex w-32">
        <input type="number" [(ngModel)]="kilometros" class="h-12 font-bold border border-gray-300 text-gray-600 text-base rounded-lg block w-full py-2.5 px-4 focus:outline-none">
      </div>
    </div>

    <div>
      <label for="countries" class="flex ml-10 mt-4 mb-2 text-lg font-medium text-white w-full">Tipo Transporte</label>
    </div>

    <div class="flex w-full">
      <select class="w-full h-12 font-bold border border-gray-300 text-gray-600 text-base rounded-lg block w-full py-2.5 px-4 focus:outline-none"[(ngModel)]="tipoSeleccionado">
        <option *ngFor="let tipo of tiposTransporte" [value]="tipo.value">{{ tipo.label }}</option>
      </select>
    </div>

    <fieldset class="border-2 border-white rounded-md px-4 pb-5 mt-10 relative">
      <legend class="text-lg font-medium text-white px-2 ml-4">Periódo de Tiempo</legend>
    
      <div class="w-98 flex justify-center items-baseline">
        <label class="ml-2 mt-4 mb-2 text-base font-medium text-white w-32">Puntual (1 día)</label>
        <input type="checkbox" id="puntual" class="ml-5 mr-5 mt-3 checkbox-md"
               [checked]="selectedPeriod === 'puntual'" (change)="onCheckboxChange('puntual')">
    
        <label class="ml-2 mt-4 mb-2 text-base font-medium text-white w-32">Semanal (7 días)</label>
        <input type="checkbox" id="semanal" class="ml-5 mr-5 mt-3"
               [checked]="selectedPeriod === 'semanal'" (change)="onCheckboxChange('semanal')">
      </div>
    
      <div class="w-98 flex justify-center items-baseline">
        <label class="ml-2 mt-4 mb-2 text-base font-medium text-white w-32">Mensual (30 días)</label>
        <input type="checkbox" id="mensual" class="ml-5 mr-5 mt-3"
               [checked]="selectedPeriod === 'mensual'" (change)="onCheckboxChange('mensual')">
    
        <label class="ml-2 mt-4 mb-2 text-base font-medium text-white w-32">Anual (365 días)</label>
        <input type="checkbox" id="anual" class="ml-5 mr-5 mt-3"
               [checked]="selectedPeriod === 'anual'" (change)="onCheckboxChange('anual')">
      </div>
    </fieldset>
    
    <div class="flex justify-center mt-10">
      <button 
        (click)="onSubmit()" 
        class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded-lg transition duration-200">
        Calcular Huella de CO₂
      </button>
    </div>
    
    <footer class="mt-20 pb-16 text-sm text-teal-950">
      <p class="text-white">
        Coded by <b>Fran Ibañez.</b><br>
        Desarrollado con Angular y TailwindCSS
      </p>
      <hr class="w-2/6 mt-5">
    </footer>

  </div>
